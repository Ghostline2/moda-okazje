<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moda – najlepsze ceny</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5}
  header{background:#111;color:#fff;padding:20px;text-align:center}
  .note{font-size:12px;color:#666;text-align:center;padding:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:16px;max-width:1100px;margin:auto}
  .card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column}
  .card img{width:100%;height:220px;object-fit:cover}
  .body{padding:14px;display:flex;flex-direction:column;gap:8px}
  .price{font-size:22px;font-weight:700}
  .shop{color:#666;font-size:13px}
  a.btn{background:#e63946;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:600}
  .others{font-size:12px;color:#888}
</style>
</head>
<body>
<header><h1>Najlepsze ceny w modzie</h1></header>
<p class="note">Strona zawiera linki afiliacyjne – przy zakupie możemy otrzymać prowizję, bez dodatkowych kosztów dla Ciebie.</p>
<div class="grid" id="grid"></div>
<script>
fetch('products.json?'+Date.now()).then(r=>r.json()).then(items=>{
  const grid=document.getElementById('grid');
  items.forEach(p=>{
    const offers=p.offers.filter(o=>o.price).sort((a,b)=>a.price-b.price);
    const best=offers[0]||p.offers[0];
    const others=offers.slice(1).map(o=>`${o.shop}: ${o.price.toFixed(2)} zł`).join(' · ');
    grid.insertAdjacentHTML('beforeend',`
      <div class="card">
        <img src="${p.image}" alt="${p.name}" loading="lazy">
        <div class="body">
          <strong>${p.name}</strong>
          <div class="price">${best.price?best.price.toFixed(2)+' zł':'sprawdź cenę'}</div>
          <div class="shop">Najtaniej w: ${best.shop}</div>
          <a class="btn" href="${best.aff}" target="_blank" rel="sponsored nofollow noopener">Zobacz ofertę</a>
          ${others?`<div class="others">Inne: ${others}</div>`:''}
        </div>
      </div>`);
  });
});
</script>
</body>
</html>
